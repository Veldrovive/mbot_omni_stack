# tmux config for the MBot Omni Stack.
# Loaded automatically by start_omni_stack.sh. To use it for all your tmux sessions:
#   ln -s ~/mbot_omni_stack/scripts/tmux.conf ~/.tmux.conf

# --- Mouse & scrollback -------------------------------------------------------
# Click to select windows/panes, drag borders to resize, scroll wheel to scroll back.
# Hold Shift while selecting to use your terminal's own copy instead of tmux's.
set -g mouse on
set -g history-limit 50000

# --- Responsiveness & terminal ------------------------------------------------
set -sg escape-time 10              # no lag after pressing Esc
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -s set-clipboard on             # copies reach your local clipboard over SSH (supported terminals)

# --- Windows & panes ----------------------------------------------------------
set -g base-index 1                 # number windows from 1 to match the keyboard
setw -g pane-base-index 1
set -g renumber-windows on          # no gaps after closing a window
setw -g automatic-rename off        # keep the names the start script gives windows
set -g allow-rename off

# Split panes with | and -, opening in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Prefix + r reloads this file
bind r source-file ~/mbot_omni_stack/scripts/tmux.conf \; display-message "tmux config reloaded"

# --- Status bar ---------------------------------------------------------------
set -g status-interval 5
set -g display-time 2000
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 30
set -g status-left "#[bg=colour31,fg=colour255,bold] #S #[default] "
set -g status-right "#[fg=colour245]#H  %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=colour31,fg=colour255,bold] #I:#W "
setw -g window-status-activity-style "fg=colour214"
setw -g monitor-activity off
